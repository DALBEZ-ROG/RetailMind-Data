<div class="admin-usuarios-container">
  <h2 class="page-title"><mat-icon>group</mat-icon> Gestion de Usuarios</h2>

  <mat-card class="action-card">
    <button mat-raised-button color="primary" (click)="showForm = !showForm">
      <mat-icon>person_add</mat-icon> {{ showForm ? 'Cancelar' : 'Nuevo Usuario' }}
    </button>
  </mat-card>

  <!-- Formulario crear usuario -->
  <mat-card class="form-card" *ngIf="showForm">
    <mat-card-content>
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput [(ngModel)]="newUsername">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="newPassword">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="newEmail">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Rol</mat-label>
          <mat-select [(ngModel)]="newRol">
            <mat-option value="ADMIN">ADMIN</mat-option>
            <mat-option value="GERENTE">GERENTE</mat-option>
            <mat-option value="VENDEDOR">VENDEDOR</mat-option>
            <mat-option value="COMPRAS">COMPRAS</mat-option>
            <mat-option value="BODEGA">BODEGA</mat-option>
            <mat-option value="DESPACHO">DESPACHO</mat-option>
            <mat-option value="ANALISTA">ANALISTA</mat-option>
            <mat-option value="CLIENTE">CLIENTE</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <button mat-raised-button color="accent" (click)="crearUsuario()">
        <mat-icon>save</mat-icon> Crear
      </button>
    </mat-card-content>
  </mat-card>

  <!-- Tabla de usuarios -->
  <div class="table-wrapper" *ngIf="usuarios.length > 0">
    <table mat-table [dataSource]="usuarios" class="full-width">
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let r"><strong>{{ r.username }}</strong></td>
      </ng-container>
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let r">{{ r.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let r">
          <mat-chip [class.chip-admin]="r.rol === 'ADMIN'" [class.chip-cliente]="r.rol === 'CLIENTE'">
            {{ r.rol }}
          </mat-chip>
        </td>
      </ng-container>
      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let r">
          <mat-icon [class.icon-active]="r.activo" [class.icon-inactive]="!r.activo">
            {{ r.activo ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button color="warn" (click)="eliminarUsuario(r.username)"
                  *ngIf="r.username !== 'admin@retailmind.com'" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['username','nombre','rol','activo','acciones']"></tr>
      <tr mat-row *matRowDef="let r; columns: ['username','nombre','rol','activo','acciones']"></tr>
    </table>
  </div>
</div>
