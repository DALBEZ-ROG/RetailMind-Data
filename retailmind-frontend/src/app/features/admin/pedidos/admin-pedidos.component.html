<div class="admin-pedidos-container">
  <h2 class="page-title"><mat-icon>receipt_long</mat-icon> Todos los Pedidos</h2>

  <div class="filtros-container" style="background:white">
    <div class="search-bar-container" style="width:100%">
      <mat-icon class="search-icon">search</mat-icon>
      <input class="search-input"
             placeholder="Buscar por usuario..."
             [(ngModel)]="filtroUsername"
             (input)="filtrar()">
    </div>
  </div>

  <div class="empty-state" *ngIf="!loading && filteredPedidos.length === 0">
    <mat-icon>inbox</mat-icon>
    <p>No hay pedidos registrados.</p>
  </div>

  <div class="table-wrapper" *ngIf="filteredPedidos.length > 0">
    <table mat-table [dataSource]="filteredPedidos" class="full-width">
      <ng-container matColumnDef="ordenId">
        <th mat-header-cell *matHeaderCellDef>Orden</th>
        <td mat-cell *matCellDef="let r"><code>{{ getOrdenCorta(r.ordenId) }}</code></td>
      </ng-container>
      <ng-container matColumnDef="userId">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let r">{{ r.userId }}</td>
      </ng-container>
      <ng-container matColumnDef="fechaOrden">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let r">{{ r.fechaOrden | date:'dd/MM/yy HH:mm' }}</td>
      </ng-container>
      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let r"><strong>${{ r.total | number:'1.2-2' }}</strong></td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let r">
          <mat-chip class="chip-completada">{{ r.estado }}</mat-chip>
        </td>
      </ng-container>
      <ng-container matColumnDef="numItems">
        <th mat-header-cell *matHeaderCellDef>Items</th>
        <td mat-cell *matCellDef="let r">{{ r.numItems }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['ordenId','userId','fechaOrden','total','estado','numItems']"></tr>
      <tr mat-row *matRowDef="let r; columns: ['ordenId','userId','fechaOrden','total','estado','numItems']"></tr>
    </table>
  </div>
</div>
