<div class="login-wrapper">
  <!-- Background decorations -->
  <div class="login-bg-pattern"></div>
  <div class="circle-decoration circle-1"></div>
  <div class="circle-decoration circle-2"></div>
  <div class="circle-decoration circle-3"></div>

  <!-- Login card -->
  <div class="login-card" [class.shake]="shakeCard">
    <!-- Header -->
    <div class="login-header">
      <img class="login-logo" src="assets/ic_retailmind.png"
           alt="Logotipo de RetailMind" width="66" height="72">
      <span class="platform-badge">ANALYTICS PLATFORM</span>
      <h1 class="login-title">
        <span class="title-primary">RetailMind</span>
        <span class="title-secondary"> Shop</span>
      </h1>
      <p class="login-subtitle">Bienvenido de vuelta</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Username -->
      <div class="login-field">
        <label>Usuario</label>
        <div class="field-wrapper">
          <mat-icon>person</mat-icon>
          <input appTexto="email" type="text"
                 formControlName="username"
                 placeholder="Ingresa tu usuario"
                 autocomplete="username">
        </div>
        <div class="field-error"
             *ngIf="f['username'].touched && f['username'].hasError('required')">
          El usuario es requerido
        </div>
        <div class="field-error"
             *ngIf="f['username'].touched && f['username'].hasError('minlength')">
          Mínimo 3 caracteres
        </div>
      </div>

      <!-- Password -->
      <div class="login-field">
        <label>Contraseña</label>
        <div class="field-wrapper">
          <mat-icon>lock</mat-icon>
          <input [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password"
                 placeholder="Ingresa tu contraseña"
                 autocomplete="current-password">
          <button type="button" class="toggle-password"
                  (click)="hidePassword = !hidePassword"
                  [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div class="field-error"
             *ngIf="f['password'].touched && f['password'].hasError('required')">
          La contraseña es requerida
        </div>
        <div class="field-error"
             *ngIf="f['password'].touched && f['password'].hasError('minlength')">
          Mínimo 6 caracteres
        </div>
      </div>

      <!-- Submit button -->
      <button type="submit" class="login-btn"
              [disabled]="loading || loginForm.invalid">
        <mat-spinner *ngIf="loading" diameter="24" class="btn-spinner"></mat-spinner>
        <span *ngIf="!loading">INICIAR SESIÓN</span>
      </button>

      <!-- Error message -->
      <div class="login-error" *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <p class="login-footer">RetailMind Analytics &copy; 2026</p>
</div>
