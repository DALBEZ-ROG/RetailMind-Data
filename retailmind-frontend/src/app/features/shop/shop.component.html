<div class="shop-container">
  <!-- Header de tienda -->
  <div class="shop-header">
    <h2 class="shop-title">
      <mat-icon>storefront</mat-icon>
      RetailMind Shop
    </h2>
    <div class="header-actions">
      <button mat-icon-button (click)="irAlCarrito()" [matBadge]="carritoCount"
              matBadgeColor="accent" [matBadgeHidden]="carritoCount === 0">
        <mat-icon>shopping_cart</mat-icon>
      </button>
    </div>
  </div>

  <!-- Filtros de categoría -->
  <div class="category-chips-container">
    <div *ngFor="let cat of categorias"
         class="category-chip"
         [class.chip-electronics]="cat.nombre === 'Electronics'"
         [class.chip-groceries]="cat.nombre === 'Groceries'"
         [class.chip-sports]="cat.nombre === 'Sports'"
         [class.chip-accessories]="cat.nombre === 'Accessories'"
         [class.chip-beauty]="cat.nombre === 'Beauty'"
         [class.chip-home]="cat.nombre === 'Home'"
         [class.chip-shoes]="cat.nombre === 'Shoes'"
         [class.chip-apparel]="cat.nombre === 'Apparel'"
         [class.selected]="categoriaSeleccionada === cat.categoriaId"
         (click)="filtrarCategoria(cat.categoriaId)">
      <mat-icon>{{ getCategoryIcon(cat.categoriaId) }}</mat-icon>
      <span>{{ cat.nombre }} ({{ cat.total }})</span>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading-container" *ngIf="loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <!-- Grid de productos -->
  <div class="products-grid" *ngIf="!loading">
    <mat-card class="product-card"
              *ngFor="let p of productos"
              [class.categoria-activa]="categoriaSeleccionada && p.categoriaId === categoriaSeleccionada"
              [class.categoria-inactiva]="categoriaSeleccionada && p.categoriaId !== categoriaSeleccionada"
              [ngStyle]="getCardStyle(p)"
              (click)="verProducto(p.productoId)">
      <div class="product-image-area"
           [ngStyle]="getImageAreaStyle(p)">
        <mat-icon [ngStyle]="getIconStyle(p)">{{ getCategoryIcon(p.categoriaId) }}</mat-icon>
      </div>
      <mat-card-content class="product-info">
        <p class="product-brand">{{ p.brand }}</p>
        <h3 class="product-name">{{ p.nombre }}</h3>
        <p class="product-category">{{ p.categoriaNombre }}</p>
        <p class="product-price">${{ p.price | number:'1.2-2' }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" class="btn-cart"
                (click)="agregarAlCarrito(p, $event)">
          <mat-icon>add_shopping_cart</mat-icon> Agregar
        </button>
        <button mat-icon-button class="btn-wishlist" (click)="toggleWishlist(p, $event)">
          <mat-icon [class.wishlist-active]="isInWishlist(p.productoId)">
            {{ isInWishlist(p.productoId) ? 'favorite' : 'favorite_border' }}
          </mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>

  <!-- Empty state -->
  <div class="empty-state" *ngIf="!loading && productos.length === 0">
    <mat-icon>inventory_2</mat-icon>
    <p>No se encontraron productos</p>
  </div>

  <!-- Paginación -->
  <mat-paginator *ngIf="totalProductos > 0"
                 [length]="totalProductos" [pageSize]="size" [pageIndex]="page"
                 [pageSizeOptions]="[12, 24, 48]" (page)="onPageChange($event)"
                 showFirstLastButtons>
  </mat-paginator>
</div>
