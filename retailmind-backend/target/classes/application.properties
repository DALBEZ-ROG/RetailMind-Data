# ── Servidor ──────────────────────────────────────────────
server.port=8080

# ── PostgreSQL ────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/CDRetail_Intelligence
spring.datasource.username=postgres
spring.datasource.password=1250143656
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# ── Paginación por defecto ────────────────────────────────
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ── Logging ───────────────────────────────────────────────
logging.level.com.retailmind=INFO
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/retailmind.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ── ETL Python ────────────────────────────────────────────
etl.python.path=py
etl.scripts.path=C:/Users/ASUS/Documents/UTEQ/6 SEMESTRE/Construccion de software/1M6DatosCS/retailmind

# ── Multipart upload ──────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── JWT ───────────────────────────────────────────────────
jwt.secret=retailmind-secret-key-2024-very-long-secure-string
jwt.expiration=86400000
jwt.refresh-expiration=604800000
