# ── Servidor ──────────────────────────────────────────────
server.port=8080

# ── Configuracion local NO versionada (modo desarrollo) ───
# Fuera de Docker no hay nadie que inyecte las variables de entorno, asi que
# los secretos se leen de `application-local.properties` (hermano de este
# archivo, en .gitignore). El prefijo `optional:` es lo que hace que su
# ausencia NO rompa nada: dentro del contenedor el archivo no existe y las
# variables llegan por el entorno del compose.
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# ── PostgreSQL Datasource (transaccional/operativo + auth) ──
# La app se conecta como retailmind_app (LOGIN NOINHERIT), nunca como postgres.
postgres.datasource.url=${POSTGRES_DATASOURCE_URL:jdbc:postgresql://localhost:5432/retailmind}
postgres.datasource.username=${POSTGRES_DATASOURCE_USERNAME:retailmind_app}
# SIN valor por defecto A PROPOSITO: que la aplicacion FALLE al arrancar si
# falta la contrasena es mejor que arrancar con la de produccion incrustada
# en el codigo fuente y versionada.
postgres.datasource.password=${POSTGRES_DATASOURCE_PASSWORD}

# ── ClickHouse Datasource (solo analytics) ────────────────
# `localhost`, NO una IP de WSL: la que habia aqui (172.29.94.38) dependia de
# una maquina concreta y cambia al reiniciar WSL. En Docker el compose la pisa;
# fuera de Docker no la pisaba nadie, asi que el modo desarrollo dependia de
# que esa IP siguiera resolviendo.
clickhouse.datasource.url=${CLICKHOUSE_DATASOURCE_URL:jdbc:ch://localhost:8123/retailmind?compress=0}
clickhouse.datasource.username=${CLICKHOUSE_DATASOURCE_USERNAME:default}
clickhouse.datasource.password=${CLICKHOUSE_DATASOURCE_PASSWORD}
clickhouse.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

# ── Los datasources se declaran manualmente (PostgresConfig / ClickHouseConfig) ──
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ── Logging ───────────────────────────────────────────────
logging.level.com.retailmind=INFO
logging.file.name=logs/retailmind.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ── ETL Python ────────────────────────────────────────────
etl.python.path=${ETL_PYTHON_PATH:python}
etl.scripts.path=${ETL_SCRIPTS_PATH:/app}

# ── Actualizacion del DWH (orquestador etl/dwh/run_etl.py) ─
# Directorio desde el que se invoca `python -m etl.dwh.run_etl`: la raiz del
# paquete ETL. En Docker, compose monta ./retailmind en /etl; en local, el
# backend arranca desde retailmind-backend/ y la ruta relativa resuelve sola.
dwh.etl.path=${DWH_ETL_PATH:${ETL_SCRIPTS_PATH:../retailmind}}
# Interprete. En Windows el ejecutable es `py` (no existe `python` en el PATH);
# en el contenedor es `python`, y compose lo fija por variable de entorno.
dwh.python.path=${DWH_PYTHON_PATH:py}
# Corrida diaria a las 02:00 HORA DE ECUADOR. La zona es obligatoria: sin ella
# el cron se interpreta en la zona de la JVM (UTC en contenedor) y las 02:00 se
# dispararian a las 21:00 locales. Poner `-` desactiva la programacion.
dwh.programacion.cron=${DWH_CRON:0 0 2 * * *}
dwh.programacion.zona=${DWH_ZONA:America/Guayaquil}

# ── Inicializacion ClickHouse ─────────────────────────────
init.scripts.path=${INIT_SCRIPTS_PATH:/app}
CH_HOST=${CH_HOST:localhost}
CH_PORT=${CH_PORT:8123}
CH_DATABASE=${CH_DATABASE:retailmind}
CH_USER=${CH_USER:default}
CH_PASSWORD=${CH_PASSWORD}

# ── Multipart upload ──────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── JWT ───────────────────────────────────────────────────
# SIN valor por defecto: un secreto de firma incrustado en el codigo no es un secreto.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
