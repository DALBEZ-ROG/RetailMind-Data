# ── Servidor ──────────────────────────────────────────────
server.port=8080

# ── PostgreSQL ────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/CDRetail_IntelligenceViejo2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1250143656}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Paginación por defecto ────────────────────────────────
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ── Logging ───────────────────────────────────────────────
logging.level.com.retailmind=INFO
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/retailmind.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ── ETL Python ────────────────────────────────────────────
etl.python.path=${ETL_PYTHON_PATH:python}
etl.scripts.path=${ETL_SCRIPTS_PATH:/app}

# ── Inicializacion ClickHouse ─────────────────────────────
init.scripts.path=${INIT_SCRIPTS_PATH:/app}
CH_HOST=${CH_HOST:172.29.94.38}
CH_PORT=${CH_PORT:8123}
CH_DATABASE=${CH_DATABASE:retailmind}
CH_USER=${CH_USER:default}
CH_PASSWORD=${CH_PASSWORD:retailmind2026}

# ── ClickHouse Datasource (Analytics) ────────────────────
clickhouse.datasource.url=${CLICKHOUSE_DATASOURCE_URL:jdbc:ch://172.29.94.38:8123/retailmind?compress=0}
clickhouse.datasource.username=${CLICKHOUSE_DATASOURCE_USERNAME:default}
clickhouse.datasource.password=${CLICKHOUSE_DATASOURCE_PASSWORD:retailmind2026}
clickhouse.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

# ── Multipart upload ──────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:retailmind-secret-key-2024-very-long-secure-string}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
