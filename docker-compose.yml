# =====================================================================
# RetailMind — compose objetivo (§5 de docs/DESPLIEGUE_DISENO.md)
#
# 6 servicios: postgres, clickhouse, backend, frontend, etl y pgadmin.
# `pocketbase` SE ELIMINO: era el origen del pipeline de la etapa
# anterior y ninguna pieza operativa lo toca (§5.7).
#
#   Desarrollo  (backend y frontend en el anfitrion):
#       docker compose up -d                    -> postgres + clickhouse
#   Demo / feria (todo dentro de Docker):
#       docker compose --profile demo up -d --build
#   Herramientas (a demanda, no consumen memoria en la feria):
#       docker compose --profile tools run --rm etl python -m etl.dwh.run_etl
#       docker compose --profile tools up -d pgadmin
#
# `.env` fija COMPOSE_PROFILES=demo para que la feria sea LITERALMENTE
# `docker compose up -d`; quien desarrolle usa
# `docker compose up -d postgres clickhouse`.
#
# ---------------------------------------------------------------------
# ANTES DEL PRIMER `up`, EN ESTA MAQUINA — leer esto entero
#
# Hay contenedores VIVOS de dos proyectos anteriores atados a los MISMOS
# volumenes. Dos servidores sobre un mismo directorio de datos es
# corrupcion, no un conflicto de puertos. Hay que bajarlos primero:
#
#     docker compose -p 1m6datoscs down                                  # clickhouse viejo
#     docker compose -f deploy/postgres/docker-compose.migracion.yml down # postgres de la migracion
#
# Ninguno de los dos `down` lleva `-v`: los volumenes se conservan y este
# compose los reutiliza (el de PostgreSQL ya trae la base restaurada y
# verificada; el de ClickHouse trae un dato irreproducible).
# =====================================================================

name: retailmind          # fija el prefijo de red y volumenes: ya no
                          # depende del nombre de la carpeta (§2.2)

networks:
  retailmind:
    name: retailmind_net  # nombre FIJO: el compose de Airflow se
                          # enganchara como red externa (§7)

volumes:
  # --- PostgreSQL: reproducible, luego NO external ---------------------
  # En una maquina nueva tiene que crearse solo para que
  # `docker-entrypoint-initdb.d` restaure la base. Con `external: true`
  # un clon del repositorio no arrancaria nunca.
  # El `name:` explicito NO es cosmetico: en esta maquina existe un
  # volumen huerfano `1m6datoscs_postgres_data` con datos de PostgreSQL
  # **15**; sin nombre propio, Docker podria caer sobre el y la imagen 18
  # se negaria a arrancar con «database files are incompatible».
  pg_data:
    name: retailmind_pg_data
    # AVISO ESPERADO en esta maquina, no es un error: como el volumen lo
    # creo el compose de la migracion, `up` imprime
    #   «volume "retailmind_pg_data" already exists but was created for
    #    project "retailmind-migracion" (expected "retailmind")»
    # Docker lo REUTILIZA igualmente —es lo que queremos: ahi esta la
    # base ya restaurada y verificada—; solo avisa de que la etiqueta de
    # proyecto no coincide. NO hay que "arreglarlo" poniendo
    # `external: true` (rompe la maquina nueva) ni borrando el volumen
    # (borra la base). Desaparece solo el dia que el volumen se cree
    # desde cero bajo este proyecto.

  # --- ClickHouse: IRREPRODUCIBLE, luego SI external -------------------
  # `retailmind.fact_eventos` (2.823.245 filas) solo existe aqui: el
  # 96,2 % lo genero un script con semilla no fijada y el resto es un
  # dataset externo. Perder el volumen = perder las pantallas de
  # analitica PARA SIEMPRE.
  # `external: true` es la pieza que evita el PEOR fallo posible del
  # despliegue: arrancar con un almacen vacio y creer que todo funciona.
  # Si el volumen no esta, `up` se niega a arrancar y lo dice.
  clickhouse_data:
    name: 1m6datoscs_clickhouse_data
    external: true

  # --- Airflow: solo sus LOGS de tarea ---------------------------------
  # Los metadatos viven en la base `airflow` del contenedor PostgreSQL,
  # no aqui. Este volumen guarda unicamente el log por intento de tarea,
  # que es lo que se abre en la interfaz al pinchar un cuadrito. Se puede
  # borrar sin perder nada del pipeline.
  airflow_logs:
    name: retailmind_airflow_logs

secrets:
  # La imagen de PostgreSQL admite `POSTGRES_PASSWORD_FILE`, asi que la
  # contrasena del superusuario NO viaja por una variable de entorno
  # (visible en `docker inspect` y en `docker compose config`).
  pg_superuser:
    file: ./deploy/secrets/pg_superuser.txt

# =====================================================================
# Bloques reutilizables de Airflow (perfil `airflow`)
# =====================================================================
# Van como campos de extension `x-` de NIVEL SUPERIOR y no como anclas
# dentro de un servicio, porque `airflow-init` necesita el mismo entorno
# MAS una clave propia. Con el ancla colgando de un servicio no hay forma
# de anadirle nada; con `<<: *airflow_env` si.
x-airflow-env: &airflow_env
  # --- metadatos de Airflow (base `airflow`, NO `retailmind`) ---------
  AIRFLOW_METADB_HOST: postgres
  AIRFLOW_METADB_PORT: "5432"
  AIRFLOW_METADB_NAME: airflow
  AIRFLOW_METADB_USER: airflow
  AIRFLOW_METADB_PASSWORD: ${AIRFLOW_PG_PASSWORD:?falta AIRFLOW_PG_PASSWORD}
  # --- Airflow propiamente dicho --------------------------------------
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://airflow:${AIRFLOW_PG_PASSWORD}@postgres:5432/airflow
  # LocalExecutor y no Celery: no hace falta Redis ni workers para 22
  # tareas de segundos. Permite paralelismo real —las 14 tablas sin
  # dependencias corren a la vez— con UN solo proceso.
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"   # la interfaz solo ensena el DAG del proyecto
  AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Guayaquil
  # El DAG nace PAUSADO: aparece en la interfaz y espera a que alguien
  # pulse ▶. Con "False", el scheduler lo disparaba SOLO al descubrirlo —y
  # con `catchup=False` eso es una corrida inmediata—, de modo que en
  # mitad de una explicacion podia arrancar una carga que nadie pidio.
  #
  # PARA DEJAR LA PROGRAMACION DIARIA ACTIVA (02:00 America/Guayaquil):
  #   a) puntual, sin tocar archivos — el interruptor de la propia
  #      interfaz, o
  #        docker compose exec airflow-scheduler airflow dags unpause retailmind_dwh
  #      (persiste: el estado de pausa vive en la base de metadatos)
  #   b) permanente para DAGs nuevos — poner "True" aqui y relanzar el
  #      perfil. Ojo: solo afecta al ALTA de un DAG, no a los ya
  #      registrados, que conservan el estado que tengan.
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
  # Sin clave FIJA, Airflow genera una por proceso y el webserver no
  # puede leer lo que cifro el scheduler.
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?falta AIRFLOW_FERNET_KEY}
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
  # La interfaz muestra las horas en la zona del negocio, igual que
  # `esta_en_horario()` y que el cron que se esta replicando.
  AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Guayaquil
  # --- lo que el ETL necesita para alcanzar las dos bases -------------
  # Nombres de SERVICIO de la red de Docker, jamas localhost: dentro del
  # contenedor `localhost` es el propio contenedor.
  # `conexiones.py` llama a `load_dotenv()` SIN `override=True`, asi que
  # este entorno gana sobre `retailmind/.env`, que trae valores de
  # anfitrion.
  ETL_PG_HOST: postgres
  ETL_PG_PORT: "5432"
  ETL_PG_DATABASE: retailmind
  ETL_PG_USER: retailmind_etl
  ETL_PG_PASSWORD: ${PG_ETL_PASSWORD:?falta PG_ETL_PASSWORD}
  ETL_CH_HOST: clickhouse
  ETL_CH_PORT: "8123"
  ETL_CH_DATABASE: retailmind_dwh
  ETL_CH_USER: ${CH_USER}
  ETL_CH_PASSWORD: ${CH_PASSWORD}
  PYTHONPATH: /opt/retailmind
  PYTHONIOENCODING: utf-8    # el ETL imprime acentos y cajas
  TZ: America/Guayaquil
  # OJO: las credenciales de la INTERFAZ de Airflow NO van aqui. Este
  # bloque lo comparten los tres servicios y solo `airflow-init` crea el
  # usuario, asi que viven en su `environment` propio (mas abajo). Puestas
  # aqui acabarian tambien en el scheduler y en el webserver, que no las
  # necesitan para nada.

x-airflow-volumes: &airflow_volumes
  - ./retailmind/airflow/dags:/opt/airflow/dags:ro
  - ./retailmind:/opt/retailmind          # el ETL, montado (no copiado)
  - airflow_logs:/opt/airflow/logs

services:

  # ===================================================================
  # postgres — la UNICA base transaccional del sistema
  # ===================================================================
  postgres:
    image: postgres:18            # FIJA, no `:latest`: un dump de 18 no
                                  # restaura en 17
    environment:
      POSTGRES_DB: retailmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser
      # El locale del origen es `Spanish_Ecuador.1252` (libc de Windows)
      # y NO EXISTE en Debian: un `pg_dump --create` fallaria con
      # «invalid locale name», mensaje que no sugiere la causa. Con ICU
      # `es-EC` el texto acentuado ordena como se espera y la
      # restauracion va SIN --create.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-EC --locale=C.UTF-8"
      # Estas dos las lee `deploy/postgres/initdb/02_restaurar.sh`, que
      # aborta de forma ruidosa si faltan. Solo se usan en la PRIMERA
      # creacion del volumen.
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?falta PG_APP_PASSWORD}
      PG_ETL_PASSWORD: ${PG_ETL_PASSWORD:?falta PG_ETL_PASSWORD}
      TZ: America/Guayaquil
    secrets:
      - pg_superuser
    volumes:
      # OJO: la imagen 18+ monta en `/var/lib/postgresql`, NO en
      # `/var/lib/postgresql/data` (convencion hasta la 17). Desde la 18
      # el directorio lleva la version — PGDATA=/var/lib/postgresql/18/docker
      # — para que `pg_upgrade --link` no cruce el limite del montaje.
      # Con la ruta antigua la imagen DETECTA el volumen huerfano y se
      # niega a arrancar; el mensaje habla de `pg_upgrade` y despista.
      - pg_data:/var/lib/postgresql
      # Directorio PROPIO con exactamente tres archivos, y solo se
      # ejecuta con el volumen vacio. JAMAS montar aqui
      # `retailmind/sql/postgres/`: son 93 scripts y 8 son
      # `99_revert_*.sql`; el orden lexicografico los correria AL FINAL
      # y desharia la siembra completa.
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # 5433 mientras el PostgreSQL local siga vivo; el CORTE (§9.6) es
      # poner PG_PORT=5432 en `.env`, no editar este archivo.
      - "${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retailmind"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [retailmind]
    restart: unless-stopped

  # ===================================================================
  # clickhouse — SOLO analitica. Con esto apagado el sistema entero
  # sigue funcionando y solo la analitica degrada, con aviso.
  # ===================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.4.2.10   # la version que
                                                    # ESCRIBIO el volumen
    user: "101:101"
    environment:
      # El almacen VIVO es `retailmind_dwh`. La base legada `retailmind`
      # sigue existiendo en el volumen y `analytics/` la nombra
      # cualificada, asi que no se pierde nada.
      # (Estas tres solo actuan si el volumen esta vacio; aqui no lo
      # esta, luego son declarativas: dicen a quien lea que base manda.)
      CLICKHOUSE_DB: retailmind_dwh
      CLICKHOUSE_USER: ${CH_USER}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
      TZ: America/Guayaquil
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      # 8123 se sigue publicando: el ETL corriendo EN EL ANFITRION
      # (modo desarrollo) lo necesita.
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [retailmind]
    restart: unless-stopped

  # ===================================================================
  # backend — Spring Boot. Es el servicio que mas cambia respecto del
  # compose anterior: alli no recibia UNA SOLA variable de PostgreSQL y
  # caia en `localhost:5432` DENTRO del contenedor, con lo que fallaba
  # todo lo operativo empezando por el login.
  # ===================================================================
  backend:
    build: ./retailmind-backend
    profiles: ["demo"]
    environment:
      # --- lo que faltaba por completo ---
      POSTGRES_DATASOURCE_URL: jdbc:postgresql://postgres:5432/retailmind
      POSTGRES_DATASOURCE_USERNAME: retailmind_app
      POSTGRES_DATASOURCE_PASSWORD: ${PG_APP_PASSWORD:?falta PG_APP_PASSWORD}
      # --- ClickHouse ---
      # La URL apunta a la base LEGADA a proposito: `analytics/` la
      # necesita por defecto y los informes compuestos cualifican
      # `retailmind_dwh.tabla` explicitamente.
      CLICKHOUSE_DATASOURCE_URL: jdbc:ch://clickhouse:8123/retailmind?compress=0
      CLICKHOUSE_DATASOURCE_USERNAME: ${CH_USER}
      CLICKHOUSE_DATASOURCE_PASSWORD: ${CH_PASSWORD}
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_DATABASE: retailmind
      CH_USER: ${CH_USER}
      CH_PASSWORD: ${CH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      # Semilla del usuario admin (DataInitializer). SIN `:?` a proposito: no
      # condiciona el arranque, solo la creacion del admin en una base vacia.
      # Antes estaba compilada en el jar como constante de DataInitializer.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # --- ETL invocado DESDE el backend (boton y @Scheduled) ---
      ETL_SCRIPTS_PATH: /etl
      # INIT_SCRIPTS_PATH es la que faltaba, y su ausencia era un fallo
      # SILENCIOSO: `application.properties` declara
      # `init.scripts.path=${INIT_SCRIPTS_PATH:/app}`, asi que sin ella caia
      # en `/app`, donde solo hay `app.jar`. `InicializacionController` es la
      # UNICA clase que lee esa propiedad —`EtlService` usa
      # `etl.scripts.path`, que si estaba—, de modo que la pantalla
      # `/inicializacion` fallaba con
      #   python: can't open file '/app/etl/carga/10_verify_clickhouse.py'
      # mientras el archivo estaba en /etl/etl/carga/. Los indicadores se
      # apagaban con ClickHouse sano y con sus 2,8 M de filas intactas.
      # Mismo valor que ETL_SCRIPTS_PATH: ambas apuntan a la raiz del paquete
      # ETL, que es lo que monta el volumen `./retailmind:/etl` de abajo.
      INIT_SCRIPTS_PATH: /etl
      DWH_ETL_PATH: /etl
      DWH_PYTHON_PATH: python    # ← lo que faltaba: en la imagen NO
      ETL_PYTHON_PATH: python    #   existe `py`, solo `python`
      ETL_PG_HOST: postgres      # ← ahora SI alcanzable
      ETL_PG_PORT: "5432"
      ETL_PG_DATABASE: retailmind
      ETL_PG_USER: retailmind_etl
      ETL_PG_PASSWORD: ${PG_ETL_PASSWORD:?falta PG_ETL_PASSWORD}
      ETL_CH_HOST: clickhouse
      ETL_CH_PORT: "8123"
      ETL_CH_DATABASE: retailmind_dwh
      ETL_CH_USER: ${CH_USER}
      ETL_CH_PASSWORD: ${CH_PASSWORD}
      # AIRFLOW YA TOMO EL RELEVO: el DAG `retailmind_dwh` esta ACTIVO con
      # `0 2 * * *`, asi que el @Scheduled del backend tiene que quedarse
      # apagado (`-`). Si los dos corren, a las 02:00 disparan LOS DOS y
      # dos cargas concurrentes compiten por el `EXCHANGE TABLES` del mismo
      # destino. Que sea una variable es lo que hace ese apagado un cambio
      # de `.env` y no una recompilacion.
      # El DEFECTO tambien es `-`: antes era el cron, y bastaba desplegar
      # sin la variable en el `.env` para revivir la colision en silencio.
      DWH_CRON: ${DWH_CRON:--}
      DWH_ZONA: America/Guayaquil
      TZ: America/Guayaquil
    volumes:
      # Es lo que permite que el boton «Actualizar almacen» y el
      # @Scheduled funcionen DENTRO del contenedor. Con DWH_PYTHON_PATH
      # y las ETL_PG_* de arriba, por primera vez el pipeline completo
      # corre dentro de Docker.
      # Las ETL_* se pasan por entorno AUNQUE `retailmind/.env` este
      # montado: `conexiones.py` llama a `load_dotenv()` SIN
      # `override=True`, asi que el entorno del contenedor manda.
      - ./retailmind:/etl
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy    # el backend no arranca antes que su base
      clickhouse:
        condition: service_started    # a proposito NO service_healthy:
                                      # el invariante del sistema es que
                                      # con ClickHouse apagado TODO
                                      # funciona y solo la analitica
                                      # degrada. Condicionarlo lo
                                      # convertiria en dependencia dura.
    healthcheck:
      # Comprueba el CUERPO y no el codigo HTTP: /api/health responde
      # 200 tambien con PostgreSQL caido, con `status: DOWN`. Es
      # `permitAll`, asi que no necesita token.
      # 127.0.0.1 por la misma razon que en `frontend`: aqui funciona con
      # `localhost` solo porque Tomcat abre doble pila, que es suerte y
      # no diseno. Fijarlo lo hace determinista.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s    # margen para que Spring levante sin marcarse enfermo
    networks: [retailmind]
    restart: unless-stopped

  # ===================================================================
  # frontend — Angular servido por nginx
  # ===================================================================
  frontend:
    build: ./retailmind-frontend
    profiles: ["demo"]
    ports:
      - "4200:80"
    depends_on:
      backend:
        # nginx resuelve `backend` AL ARRANCAR y, si el contenedor aun no
        # existe, falla el arranque del propio nginx. Esperar a
        # `service_healthy` elimina esa carrera y garantiza que la
        # primera pantalla que vea el publico ya responda.
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 y NO `localhost`: dentro del contenedor `localhost`
      # resuelve a 127.0.0.1 **y a ::1**, el wget de busybox prueba IPv6
      # primero y nginx solo declara `listen 80;` (IPv4). Con `localhost`
      # el healthcheck da «Connection refused» ETERNAMENTE aunque la
      # pagina se sirva perfectamente — y como el `frontend` es el ultimo
      # de la cadena, el sintoma es un `unhealthy` permanente en la
      # pantalla que el publico SI esta viendo funcionar.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [retailmind]
    restart: unless-stopped

  # ===================================================================
  # etl — mismo servicio, proposito NUEVO
  # Deja de ser un contenedor ocioso con `tail -f /dev/null` y pasa a ser
  # el EJECUTOR PUNTUAL del pipeline, ya conectado a las dos bases.
  # Es ademas el ENSAYO del operador de Airflow: cada tarea del DAG sera
  # exactamente uno de estos comandos. Si funciona aqui, funciona alli.
  # ===================================================================
  etl:
    build: ./retailmind
    profiles: ["tools"]        # NO arranca con `up`: se invoca a demanda
    environment:
      ETL_PG_HOST: postgres
      ETL_PG_PORT: "5432"
      ETL_PG_DATABASE: retailmind
      ETL_PG_USER: retailmind_etl
      ETL_PG_PASSWORD: ${PG_ETL_PASSWORD:?falta PG_ETL_PASSWORD}
      ETL_CH_HOST: clickhouse
      ETL_CH_PORT: "8123"
      ETL_CH_DATABASE: retailmind_dwh
      ETL_CH_USER: ${CH_USER}
      ETL_CH_PASSWORD: ${CH_PASSWORD}
      TZ: America/Guayaquil
    volumes:
      - ./retailmind:/app      # WORKDIR de la imagen
    networks: [retailmind]
    # Sin `command`: se usa como
    #   docker compose --profile tools run --rm etl python -m etl.dwh.run_etl
    #   docker compose --profile tools run --rm etl python -m etl.dwh.validar_dwh

  # ===================================================================
  # AIRFLOW — perfil `airflow`, NO arranca con `up -d`
  # ===================================================================
  # Tres servicios (init + scheduler + webserver) bajo el perfil
  # `airflow`. Como `.env` fija COMPOSE_PROFILES=demo, un `up -d` a secas
  # NO los levanta y el arranque de la feria sigue siendo el de siempre
  # (~28 s, medido antes y despues de anadir esto). Solo los incorpora:
  #
  #     docker compose --profile airflow up -d
  #
  # Airflow ENVUELVE el ETL: cada tarea del DAG ejecuta
  # `python -m etl.dwh.run_etl`, el mismo comando del contenedor `etl` y
  # el mismo que lanza el boton del backend. Por eso estos servicios
  # montan `./retailmind` en `/opt/retailmind` en vez de copiar codigo:
  # un cambio en el pipeline NO obliga a reconstruir la imagen.
  #
  # La base de metadatos vive en el MISMO contenedor PostgreSQL, en una
  # base SEPARADA llamada `airflow`, con rol propio, creada por
  # `retailmind/airflow/init_metadb.py`. La base `retailmind` no se toca.
  #
  # PUERTO 8081 y no 8080: el 8080 es del backend.
  # ===================================================================

  airflow-init:
    build: ./retailmind/airflow
    image: retailmind-airflow:2.10.5
    profiles: ["airflow"]
    # Un solo disparo: crea la base de metadatos, migra el esquema de
    # Airflow y deja el usuario admin. Luego sale. `restart: "no"` es
    # obligatorio: con la politica por defecto del proyecto
    # (`unless-stopped`) un contenedor que TERMINA BIEN se reiniciaria en
    # bucle para siempre.
    restart: "no"
    environment:
      <<: *airflow_env
      # LA CLAVE DE ESTE SERVICIO, y cuesta un rato descubrirla:
      # el entrypoint de la imagen oficial ejecuta `airflow db check` y
      # espera a la base ANTES de lanzar el `command`. Aqui eso es un
      # circulo: la base y el rol `airflow` no existen todavia porque los
      # crea justamente el `command`. Sin esto, el init muere con
      # «ERROR! Maximum number of retries (20) reached» y un
      # «password authentication failed for user "airflow"» que apunta a
      # una contrasena mal puesta y no a lo que de verdad pasa.
      # `0` desactiva esa espera SOLO en el init; el scheduler y el
      # webserver la conservan, que es donde si tiene sentido.
      CONNECTION_CHECK_MAX_COUNT: "0"
      # --- credenciales de la INTERFAZ, solo aqui -----------------------
      # Vienen del `.env`; en el compose no hay ni un valor escrito. El
      # `command` las lee con `$${...}` (doble dolar) para que las expanda
      # el SHELL DEL CONTENEDOR y no Compose: con `${...}` sencillo,
      # Compose las sustituia al parsear y la contrasena quedaba EN CLARO
      # dentro del texto del `command`, que es de donde habia que sacarla.
      # Sin valor por defecto a proposito: un `:-admin` vuelve a ser una
      # credencial escrita en el compose.
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?falta AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?falta AIRFLOW_ADMIN_PASSWORD}
    volumes: *airflow_volumes
    secrets:
      - pg_superuser        # solo `airflow-init` lo necesita: es quien
                            # emite el CREATE DATABASE
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        echo "--- 1/3 base de metadatos (no toca retailmind) ---"
        python /opt/retailmind/airflow/init_metadb.py
        echo "--- 2/3 esquema de Airflow ---"
        airflow db migrate
        echo "--- 3/3 usuario admin ---"
        # `$$` para que expanda el shell del contenedor y NO Compose: asi la
        # contrasena no aparece en `docker compose config` ni en el YAML.
        if airflow users list 2>/dev/null | grep -qw "$${AIRFLOW_ADMIN_USER}"; then
          echo "El usuario ya existe; se re-aplica la contrasena de .env."
          airflow users reset-password \
              --username "$${AIRFLOW_ADMIN_USER}" \
              --password "$${AIRFLOW_ADMIN_PASSWORD}" >/dev/null
        else
          airflow users create \
              --username "$${AIRFLOW_ADMIN_USER}" \
              --password "$${AIRFLOW_ADMIN_PASSWORD}" \
              --firstname RetailMind --lastname Admin \
              --role Admin --email admin@retailmind.com 2>&1 | tail -1
        fi
        echo "--- init COMPLETO ---"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [retailmind]

  airflow-scheduler:
    build: ./retailmind/airflow
    image: retailmind-airflow:2.10.5
    profiles: ["airflow"]
    # Es quien EJECUTA las tareas con LocalExecutor, asi que es este
    # contenedor —y no el webserver— el que necesita alcanzar PostgreSQL
    # y ClickHouse con las ETL_*.
    environment: *airflow_env
    volumes: *airflow_volumes
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        # `service_started` y NO `service_healthy`, por el mismo
        # invariante que el backend: ClickHouse no es una dependencia
        # dura del sistema. Si esta caido, el DAG fallara y lo dira, que
        # es justo lo que debe pasar.
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    networks: [retailmind]
    restart: unless-stopped

  airflow-webserver:
    build: ./retailmind/airflow
    image: retailmind-airflow:2.10.5
    profiles: ["airflow"]
    environment: *airflow_env
    volumes: *airflow_volumes
    command: ["airflow", "webserver"]
    ports:
      - "8081:8080"      # 8080 dentro; fuera 8081 porque el backend usa el 8080
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1 y no `localhost`, por la misma razon que en `frontend`:
      # `localhost` resuelve tambien a ::1 y el chequeo quedaria colgado
      # en IPv6 con la pagina sirviendose bien.
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [retailmind]
    restart: unless-stopped

  # ===================================================================
  # pgadmin — opcional, solo si en la feria hace falta ensenar el
  # esquema, los roles o las politicas RLS sin abrir una terminal.
  # ===================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@retailmind.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      TZ: America/Guayaquil
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [retailmind]
